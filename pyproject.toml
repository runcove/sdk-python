[build-system]
requires = ["hatchling>=1.27"]  # 1.27 is the first with PEP 639 `license` / `license-files`
build-backend = "hatchling.build"

[project]
name = "runcove-sdk"
version = "0.1.1"
description = "Python client for the Cove API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29", "anyio>=4.0,<5", "attrs>=23.1", "typing-extensions>=4.7"]

[project.urls]
Homepage = "https://github.com/runcove/sdk-python"
Source = "https://github.com/runcove/sdk-python"
Issues = "https://github.com/runcove/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cove_sdk"]   # explicit on purpose: a rename must not ship an empty wheel
exclude = ["AGENTS.md", "CLAUDE.md"]   # belt and braces: `packages` already limits it to cove_sdk

[tool.hatch.build.targets.sdist]
# An allowlist, so a file added to this directory later (an agent-instructions file under any
# name, a .claude/ directory, a design note) never ships by default. AGENTS.md, CLAUDE.md (a
# symlink to it) and the CI workflow are the repository's working files, not part of a package,
# and the release's content gate refuses the first (internal pointers) and the symlink. The
# tests stay, as a PyPI sdist conventionally carries them. A new file the sdist should carry is
# added here. tests/ci/test-sdk-python-dist-members.sh holds this.
only-include = [
    "src", "tests", "examples", "scripts",
    "README.md", "LICENSE", "pyproject.toml", ".gitignore",
    "generator-config.yaml", "requirements-dev.in", "requirements-dev.lock",
]
exclude = ["AGENTS.md", "CLAUDE.md"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/cove_sdk", "examples"]

[[tool.mypy.overrides]]
# openapi-python-client 0.29.1's client.py forwards *args to __exit__/__aexit__ (a template
# defect, 12 errors on 390 files); scoped to this module and this code only.
module = "cove_sdk._generated.client"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
